<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Awareness">
<title>Awareness</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,'Times New Roman',serif;background:#f5f4f0;color:#1a1a18;padding:2rem 1.25rem 3rem;}
@media(prefers-color-scheme:dark){body{background:#1a1a18;color:#f0efe9;}}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2.25rem;}
.greeting{font-size:22px;font-weight:400;letter-spacing:-.3px;}
.date{font-size:12px;color:#aaa;margin-top:5px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.week-tog{display:flex;gap:6px;margin-top:4px;}
.tog{border:1px solid #ddd;background:transparent;color:#aaa;border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.tog.on{background:#1a1a18;color:#f0efe9;border-color:#1a1a18;}
@media(prefers-color-scheme:dark){.tog{border-color:#3a3a38;color:#666;}.tog.on{background:#f0efe9;color:#1a1a18;border-color:#f0efe9;}}
.ring-section{display:flex;flex-direction:column;align-items:center;margin-bottom:2.5rem;}
.ring-wrap{position:relative;width:130px;height:130px;margin-bottom:1rem;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:26px;font-weight:400;letter-spacing:-.5px;}
.ring-sub{font-size:10px;color:#aaa;margin-top:2px;letter-spacing:.04em;text-transform:uppercase;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.summary-line{font-size:15px;text-align:center;font-weight:400;}
.summary-muted{font-size:12px;color:#aaa;text-align:center;margin-top:6px;line-height:1.6;max-width:260px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.sec{font-size:10px;font-weight:500;color:#bbb;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.dots-row{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:2.25rem;}
.dot-item{display:flex;align-items:center;gap:8px;border:1px solid #e8e7e2;border-radius:24px;padding:8px 14px 8px 10px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.dot-item:active{transform:scale(.96);}
@media(prefers-color-scheme:dark){.dot-item{border-color:#2e2e2c;}}
.dot-item.done{background:#f0efe8;}
@media(prefers-color-scheme:dark){.dot-item.done{background:#222220;}}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot-label{font-size:13px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.dot-count{font-size:11px;color:#bbb;margin-left:1px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.limits-col{display:flex;flex-direction:column;gap:10px;}
.lim-row{display:flex;align-items:center;gap:12px;border:1px solid #e8e7e2;border-radius:24px;padding:8px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.lim-row:active{transform:scale(.98);}
@media(prefers-color-scheme:dark){.lim-row{border-color:#2e2e2c;}}
.lim-row.over{border-color:#E24B4A;}
.lim-name{font-size:13px;width:90px;flex-shrink:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.lim-bar-wrap{flex:1;height:3px;background:#eee;border-radius:2px;}
@media(prefers-color-scheme:dark){.lim-bar-wrap{background:#2e2e2c;}}
.lim-bar{height:100%;border-radius:2px;transition:width .3s;}
.lim-nums{font-size:11px;width:36px;text-align:right;flex-shrink:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.hint{font-size:11px;color:#ccc;text-align:center;margin-top:1.5rem;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a18;color:#f0efe9;padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
@media(prefers-color-scheme:dark){.toast{background:#f0efe9;color:#1a1a18;}}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="greeting">Awareness</div>
    <div class="date" id="dateLabel"></div>
  </div>
  <div class="week-tog">
    <button class="tog on" id="bw" onclick="sv('week')">Week</button>
    <button class="tog" id="bm" onclick="sv('month')">Month</button>
  </div>
</div>
<div class="ring-section">
  <div class="ring-wrap">
    <svg width="130" height="130" viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="54" fill="none" stroke="#eee" stroke-width="9"/>
      <circle id="ringArc" cx="65" cy="65" r="54" fill="none" stroke="#1D9E75" stroke-width="9" stroke-linecap="round" stroke-dasharray="339" stroke-dashoffset="339"/>
    </svg>
    <div class="ring-label">
      <div class="ring-pct" id="ringPct">0%</div>
      <div class="ring-sub">on track</div>
    </div>
  </div>
  <div class="summary-line" id="summaryLine"></div>
  <div class="summary-muted" id="summaryMuted"></div>
</div>
<div class="sec">Targets</div>
<div class="dots-row" id="dotsRow"></div>
<div class="sec">Limits</div>
<div class="limits-col" id="limitsCol"></div>
<div class="hint">tap to add &nbsp;·&nbsp; hold to subtract</div>
<div class="toast" id="toast"></div>
<script>
var WT=[
  {id:"gym",label:"Gym",n:2,color:"#1D9E75"},
  {id:"journal",label:"Journal",n:2.5,color:"#378ADD"},
  {id:"stretch",label:"Stretch",n:3.5,color:"#85B7EB"},
  {id:"water",label:"Water",n:28,color:"#185FA5"},
  {id:"creative",label:"Creative",n:1.5,color:"#7F77DD"},
  {id:"explore",label:"Explore",n:0.6,color:"#AFA9EC"}
];
var WL=[
  {id:"restaurant",label:"Dinners out",n:3,soft:false},
  {id:"beer",label:"Beers",n:10,soft:true},
  {id:"treats",label:"Treats",n:4,soft:true}
];
var MT=[
  {id:"gym",label:"Gym",n:8,color:"#1D9E75"},
  {id:"journal",label:"Journal",n:10,color:"#378ADD"},
  {id:"stretch",label:"Stretch",n:14,color:"#85B7EB"},
  {id:"water",label:"Water",n:112,color:"#185FA5"},
  {id:"creative",label:"Creative",n:6.5,color:"#7F77DD"},
  {id:"explore",label:"Explore",n:2.5,color:"#AFA9EC"}
];
var ML=[
  {id:"restaurant",label:"Dinners out",n:12,soft:false},
  {id:"beer",label:"Beers",n:40,soft:true},
  {id:"treats",label:"Treats",n:16,soft:true}
];
var view="week";
var counts={};
function sk(id,v){return (v||view)+"_"+id;}
function gc(id,v){return counts[sk(id,v)]||0;}
function sc(id,val,v){var k=sk(id,v||view);counts[k]=Math.max(0,val);try{localStorage.setItem(k,Math.max(0,val));}catch(e){}}
function sv(v){
  view=v;
  document.getElementById("bw").className="tog"+(v==="week"?" on":"");
  document.getElementById("bm").className="tog"+(v==="month"?" on":"");
  render();
}
var tt;
function showToast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("show");},1600);}
function addOne(id){sc(id,gc(id,"week")+1,"week");sc(id,gc(id,"month")+1,"month");showToast("+1 "+id);render();}
function subOne(id){var wc=gc(id,"week");var mc=gc(id,"month");if(wc>0)sc(id,wc-1,"week");if(mc>0)sc(id,mc-1,"month");showToast("-1 "+id);render();}
function makeTappable(el,id){
  var holdTimer,didHold=false;
  el.addEventListener("touchstart",function(){didHold=false;holdTimer=setTimeout(function(){didHold=true;subOne(id);if(navigator.vibrate)navigator.vibrate(30);},500);},{passive:true});
  el.addEventListener("touchend",function(){clearTimeout(holdTimer);if(!didHold)addOne(id);},{passive:true});
  el.addEventListener("touchmove",function(){clearTimeout(holdTimer);},{passive:true});
  el.addEventListener("mousedown",function(){didHold=false;holdTimer=setTimeout(function(){didHold=true;subOne(id);},500);});
  el.addEventListener("mouseup",function(){clearTimeout(holdTimer);if(!didHold)addOne(id);});
  el.addEventListener("mouseleave",function(){clearTimeout(holdTimer);});
}
function dateLabel(){var n=new Date();if(view==="week"){var day=n.getDay();var m=new Date(n);m.setDate(n.getDate()-(day===0?6:day-1));var s=new Date(m);s.setDate(m.getDate()+6);var f=function(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});};return f(m)+" - "+f(s);}return n.toLocaleDateString("en-US",{month:"long",year:"numeric"});}
function render(){
  document.getElementById("dateLabel").textContent=dateLabel();
  var T=view==="week"?WT:MT;
  var L=view==="week"?WL:ML;
  var met=0;T.forEach(function(t){if(gc(t.id)>=t.n)met++;});
  var pct=Math.round((met/T.length)*100);
  var circ=339;
  document.getElementById("ringArc").setAttribute("stroke-dashoffset",circ-(circ*(pct/100)));
  document.getElementById("ringPct").textContent=pct+"%";
  var lines=["Just getting started.","Good momentum.","Solid "+view+".","Strong "+view+".","You nailed it."];
  document.getElementById("summaryLine").textContent=lines[Math.min(4,Math.floor(pct/25))];
  var behind=[];T.forEach(function(t){if(gc(t.id)<t.n)behind.push(t.label);});
  document.getElementById("summaryMuted").textContent=behind.length?"Still building: "+behind.join(", "):"Everything on track this "+view+".";
  var dr=document.getElementById("dotsRow");dr.innerHTML="";
  T.forEach(function(t){var c=gc(t.id);var done=c>=t.n;var d=document.createElement("div");d.className="dot-item"+(done?" done":"");d.innerHTML="<div class='dot' style='background:"+(done?t.color:"#ddd")+"'></div><span class='dot-label'>"+t.label+"</span><span class='dot-count'>"+c+"/"+Math.ceil(t.n)+"</span>";makeTappable(d,t.id);dr.appendChild(d);});
  var lc=document.getElementById("limitsCol");lc.innerHTML="";
  L.forEach(function(l){var c=gc(l.id);var over=c>l.n;var pctL=Math.min(100,Math.round((c/l.n)*100));var bc=over?"#E24B4A":pctL>75?"#EF9F27":"#ccc";var d=document.createElement("div");d.className="lim-row"+(over?" over":"");d.innerHTML="<div class='lim-name'>"+l.label+"</div><div class='lim-bar-wrap'><div class='lim-bar' style='width:"+pctL+"%;background:"+bc+"'></div></div><div class='lim-nums' style='color:"+(over?"#E24B4A":"#bbb")+"'>"+c+"/"+l.n+"</div>";makeTappable(d,l.id);lc.appendChild(d);});
}
try{var all=WT.concat(WL).concat(MT).concat(ML);all.forEach(function(i){["week","month"].forEach(function(v){var k=v+"_"+i.id;var s=localStorage.getItem(k);if(s)counts[k]=parseInt(s);});});}catch(e){}
render();
</script>
</body>
</html>
